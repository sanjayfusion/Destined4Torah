<!doctype html><html lang="en"><meta charset="utf-8"><title>D4T regression checks</title><body><h1>D4T regression checks</h1><pre id="results">Running…</pre><script type="module">
import { stripTags } from '/src/lib/sefaria.ts'
import { transliterateHebrew } from '/src/lib/transliterate.ts'
import { PARSHIYOT_BY_BOOK, findParshaEntry } from '/src/data/parshiyot.ts'
import { initialStudyRoute, loadStudyProgress, saveStudyProgress, STUDY_PROGRESS_KEY } from '/src/lib/studyProgress.ts'
import { readPassageRoute, passageUrl } from '/src/lib/passageLinks.ts'
import { fetchIsraelNews } from '/src/lib/news.ts'
const results = []
function check(name, actual, expected) {
  if (actual !== expected) throw new Error(`${name}: expected ${expected}, received ${actual}`)
  results.push(`PASS ${name}`)
}
const originalFetch = window.fetch
try {
  for (const group of PARSHIYOT_BY_BOOK.filter((group) => ['Genesis', 'Exodus'].includes(group.book))) {
    for (const entry of group.parshiyot) {
      check(`${entry.english} has teaching links`, Boolean(entry.youtubeUrls?.length), true)
      check(`${entry.english} has matching video titles`, entry.youtubeTitles?.length, entry.youtubeUrls?.length)
      check(`${entry.english} uses valid YouTube watch URLs`, entry.youtubeUrls.every((url) => /^https:\/\/www\.youtube\.com\/watch\?v=[A-Za-z0-9_-]{11}$/.test(url)), true)
    }
  }
  check('combined portions deduplicate the shared teaching', findParshaEntry('Vayakhel-Pekudei').youtubeUrls.length, 1)
  const memory = new Map()
  const storage = { getItem: (key) => memory.get(key) ?? null, setItem: (key, value) => memory.set(key, value) }
  check('first visit has no saved reading', loadStudyProgress(storage), null)
  saveStudyProgress({view:'book',book:'John',chapter:3,verse:16}, storage)
  const saved = loadStudyProgress(storage)
  check('saved verse survives round trip', saved.verse, 16)
  check('home resumes saved book', initialStudyRoute('', saved).book, 'John')
  check('shared book overrides saved reading', initialStudyRoute('?ref=Genesis+1', saved).book, 'Genesis')
  check('shared portion overrides saved reading', initialStudyRoute('?parsha=Noach', saved).parsha.english, 'Noach')
  check('About does not overwrite reading', saveStudyProgress({view:'about'}, storage), false)
  check('saved reading survives About', loadStudyProgress(storage).verse, 16)
  check('invalid shared link does not resume different book', initialStudyRoute('?ref=Bad', saved).view, 'parsha')
  memory.set(STUDY_PROGRESS_KEY, '{bad')
  check('corrupt storage is ignored', loadStudyProgress(storage), null)
  const blockedStorage = { getItem() { throw new Error('blocked') }, setItem() { throw new Error('blocked') } }
  check('blocked storage reads are safe', loadStudyProgress(blockedStorage), null)
  check('blocked storage writes are safe', saveStudyProgress({view:'book',book:'John',chapter:3}, blockedStorage), false)
  saveStudyProgress({view:'parsha',parsha:readPassageRoute('?parsha=Noach').parsha}, storage)
  check('fixed Torah portion is restored', loadStudyProgress(storage).parsha.english, 'Noach')
  const verseRoute = readPassageRoute('?ref=John+3%3A16')
  check('verse URL restores book', verseRoute.book, 'John')
  check('verse URL restores chapter', verseRoute.chapter, 3)
  check('verse URL restores verse', verseRoute.verse, 16)
  check('numbered book round trip', readPassageRoute(new URL(passageUrl({view:'book',book:'1_Samuel',chapter:17,verse:4}, 'https://app.destined4torah.com/')).search).book, 'I_Samuel')
  check('invalid chapter falls back safely', readPassageRoute('?ref=John+999').view, 'parsha')
  check('invalid portion falls back safely', readPassageRoute('?parsha=Unknown').parsha, undefined)
  check('named portion restored', readPassageRoute('?parsha=Noach').parsha.ref, 'Genesis 6:9-11:32')
  check('combined portion restored', readPassageRoute('?parsha=Vayakhel-Pekudei').parsha.ref, 'Exodus 35:1-40:38')
  check('chapter links omit previous verse', new URL(passageUrl({view:'book',book:'John',chapter:4}, 'https://app.destined4torah.com/?ref=John+3%3A16')).searchParams.get('ref'), 'John 4')
  check('weekly navigation clears fixed portion', new URL(passageUrl({view:'parsha'}, 'https://app.destined4torah.com/?parsha=Noach')).search, '')
  check('poetry line breaks keep words apart', stripTags('Day<br>and night<br/>Shall not cease.'), 'Day and night Shall not cease.')
  check('footnotes removed, legitimate italics kept', stripTags('May <i>God</i> enlarge<sup>1</sup><i class="footnote">play on Japheth.</i> Japheth'), 'May God enlarge Japheth')
  check('HTML entities preserved', stripTags('God &amp; man &#8212; &#x201c;peace&#x201d;'), 'God & man — “peace”')
  check('Noach final patach', transliterateHebrew('נֹ֔חַ'), 'Noach')
  check('ruach final patach', transliterateHebrew('ר֣וּחַ'), 'Ruach')
  check('maqaf final patach', transliterateHebrew('נֹחַ־נֹחַ'), 'Noach-noach')
  check('ordinary initial patach', transliterateHebrew('חַי'), 'Chay')
  let calls = 0
  window.fetch = async () => {
    calls++
    return { ok: true, json: async () => ({status:'ok',items: calls === 1 ? [{title:'Old',link:'https://example.com/old',pubDate:'2025-06-08 07:55:00'}] : [
      {title:'Fresh',link:'https://example.com/fresh',pubDate:new Date(Date.now()-3600000).toISOString()},
      {title:'Undated',link:'https://example.com/undated'},
      {title:'Future',link:'https://example.com/future',pubDate:new Date(Date.now()+86400000).toISOString()},
      {title:'Unsafe',link:'javascript:alert(1)',pubDate:new Date(Date.now()-3600000).toISOString()}
    ]}) }
  }
  const items = await fetchIsraelNews()
  check('stale feed triggers fallback', calls, 2)
  check('only safe recent dated articles returned', items.length, 1)
  check('correct fresh article', items[0].title, 'Fresh')
  window.fetch = async () => ({ok:true,json:async()=>({status:'ok',items:[{title:'Old',link:'https://example.com',pubDate:'2025-06-08 07:55:00'}]})})
  let rejected = false
  try { await fetchIsraelNews() } catch { rejected = true }
  check('all stale feeds rejected', rejected, true)
  document.getElementById('results').textContent = results.join('\n') + '\nAll checks passed.'
} catch (error) {
  document.getElementById('results').textContent = results.join('\n') + '\nFAIL ' + error.message
} finally { window.fetch = originalFetch }
</script></body></html>
